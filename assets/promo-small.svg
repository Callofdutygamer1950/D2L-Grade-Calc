<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280">
  <!-- Chrome Web Store small promo tile (440x280). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a7fd6"/>
      <stop offset="1" stop-color="#084f8f"/>
    </linearGradient>
  </defs>
  <rect width="440" height="280" fill="url(#bg)"/>

  <!-- icon mark -->
  <g transform="translate(32 40) scale(0.62)">
    <circle cx="64" cy="64" r="36" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="13"/>
    <circle cx="64" cy="64" r="36" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round"
            stroke-dasharray="192 227" transform="rotate(-90 64 64)"/>
    <path d="M47 65 L59 77 L82 52" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="124" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Grade Calculator</text>
  <text x="124" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#d6e9ff">for D2L Brightspace</text>

  <!-- mini badge -->
  <g transform="translate(32 150)">
    <rect width="376" height="74" rx="14" fill="#ffffff"/>
    <text x="22" y="49" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#202122">86.23%</text>
    <text x="164" y="33" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#202122">Current grade</text>
    <text x="164" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#565a5c">Weighted by your category weights</text>
  </g>

  <text x="32" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#d6e9ff">Your overall grade, right on the Grades page</text>
</svg>
